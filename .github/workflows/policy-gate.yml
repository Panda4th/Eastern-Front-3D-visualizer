name: policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      # Security boundary: inspect GitHub metadata only. Never checkout or execute PR content.
      - name: Validate PR policy
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const errors = [];
            const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const section = name => {
              const m = new RegExp(`^##\\s+${esc(name)}\\s*$`, 'mi').exec(body);
              if (!m) return null;
              const tail = body.slice(m.index + m[0].length);
              const end = tail.search(/^##\s+/m);
              return (end < 0 ? tail : tail.slice(0, end)).replace(/<!--[^]*?-->/g, '').trim();
            };
            const field = (text, name) => {
              const m = (text || '').match(new RegExp(`^${esc(name)}[ \\t]*:[ \\t]*(.*?)[ \\t]*$`, 'mi'));
              return m ? m[1].trim() : '';
            };
            const headings = ['Objective','Related Issue','Scope','Changes','Tests','Historical Data Impact','Source Traceability Impact','Client Compatibility Impact','Known Limitations','Current HEAD','SOL Independent Review','Integration Decision'];
            for (const h of headings) if (section(h) === null) errors.push(`Missing PR heading: ## ${h}`);

            const exact = (name, allowed) => {
              const value = (section(name) || '').toUpperCase();
              if (!allowed.includes(value)) errors.push(`${name} must be ${allowed.join(' / ')}.`);
              return value;
            };
            const files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: pr.number, per_page: 100});
            const names = files.map(f => f.filename);
            const governanceFiles = names.filter(p => p === 'AGENTS.md' || p === 'CLAUDE.md' || p.startsWith('.github/workflows/') || p.startsWith('.github/ISSUE_TEMPLATE/') || p === '.github/pull_request_template.md' || p.startsWith('docs/foundation/') || p.startsWith('docs/governance/'));
            const productFiles = names.filter(p => p.startsWith('src/') || p.startsWith('historical/') || p.startsWith('assets/'));
            if (governanceFiles.length && productFiles.length) {
              errors.push(`Governance-sensitive and product changes must not be mixed in one PR.\n  Governance-sensitive files:\n${governanceFiles.map(p => `    - ${p}`).join('\n')}\n  Product files:\n${productFiles.map(p => `    - ${p}`).join('\n')}`);
            }
            const historicalFiles = names.some(p => p.startsWith('historical/'));
            const declaredHistorical = (section('Historical Data Impact') || '').toUpperCase();
            if (historicalFiles && declaredHistorical !== 'YES') errors.push('Changes under historical/** require Historical Data Impact = YES.');

            if (!pr.draft) {
              const related = section('Related Issue') || '';
              const issue = related.match(/(?:^|\s)#(\d+)(?=\s|$)/);
              if (!issue) errors.push('Related Issue must contain #<number>.');
              else try {
                const response = await github.rest.issues.get({...context.repo, issue_number: Number(issue[1])});
                if (response.data.pull_request) errors.push(`Related Issue #${issue[1]} is a pull request, not an issue.`);
              } catch (_) { errors.push(`Related Issue #${issue[1]} is not readable.`); }

              const head = pr.head.sha.toLowerCase();
              // R-8.5 (corrected): full 40-character SHA only, case-insensitive exact match against PR HEAD. No short/prefix SHAs.
              const matchesHead = value => /^[0-9a-f]{40}$/i.test(value || '') && value.toLowerCase() === head;
              const shaGuidance = 'Please enter the full 40-character SHA.';
              if (!matchesHead(section('Current HEAD') || '')) errors.push(`Current HEAD must be the full 40-character PR HEAD SHA, exactly matching the actual PR HEAD. ${shaGuidance}`);
              const sol = section('SOL Independent Review') || '';
              if (!matchesHead(field(sol, 'SOL review commit'))) errors.push(`SOL review commit must be the full 40-character PR HEAD SHA, exactly matching the actual PR HEAD. ${shaGuidance}`);
              if (!matchesHead(field(sol, 'Current HEAD'))) errors.push(`SOL Current HEAD must be the full 40-character PR HEAD SHA, exactly matching the actual PR HEAD. ${shaGuidance}`);
              if (field(sol, 'SOL review decision').toUpperCase() !== 'PASS') errors.push('SOL review decision must be PASS.');
              if (field(sol, 'BLOCKER') !== '0') errors.push('BLOCKER must be 0.');
              if (field(sol, 'MUST FIX') !== '0') errors.push('MUST FIX must be 0.');
              const integration = section('Integration Decision') || '';
              if (field(integration, 'Opus decision').toUpperCase() !== 'APPROVE') errors.push('Opus decision must be APPROVE.');
              if (!matchesHead(field(integration, 'Decision HEAD'))) errors.push(`Decision HEAD must be the full 40-character PR HEAD SHA, exactly matching the actual PR HEAD. ${shaGuidance}`);

              const historical = exact('Historical Data Impact', ['NONE','YES']);
              exact('Source Traceability Impact', ['NONE','YES']);
              exact('Client Compatibility Impact', ['NONE','DESKTOP','SMARTPHONE','BOTH']);
              if (historical === 'YES') {
                const detail = section('Historical Change Detail') || '';
                for (const name of ['Affected Source IDs','Source / Evidence','Traceability Impact','Validation Result','Known Uncertainty']) {
                  if (!field(detail, name)) errors.push(`Historical Change Detail field must be non-empty: ${name}`);
                }
              }
            }

            if (errors.length) core.setFailed(errors.map(e => `- ${e}`).join('\n'));
